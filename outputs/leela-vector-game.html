<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Лила - чат с Мастером</title>
  <style>
    :root {
      --ink: #201813;
      --muted: #6b5a49;
      --line: #403126;
      --paper: #fff8e9;
      --paper-2: #f2dfbd;
      --gold: #d39b36;
      --green: #4d8648;
      --red: #b84536;
      --blue: #236d86;
      --violet: #76528d;
      --shadow: rgba(32, 24, 19, 0.2);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 14% 12%, rgba(211, 155, 54, 0.28), transparent 24rem),
        radial-gradient(circle at 86% 86%, rgba(35, 109, 134, 0.18), transparent 28rem),
        linear-gradient(135deg, #fbf3df 0%, #ead9b9 48%, #d3ba8e 100%);
      display: grid;
      place-items: center;
      padding: clamp(12px, 2vw, 26px);
    }

    .app {
      width: min(1180px, 100%);
      height: min(920px, calc(100vh - 24px));
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 14px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: end;
      color: var(--muted);
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 4vw, 42px);
      line-height: 1;
      letter-spacing: 0;
      color: var(--ink);
    }

    .state-line {
      font-size: 13px;
      text-align: right;
      line-height: 1.35;
    }

    .stage {
      min-height: 0;
      border: 3px solid var(--line);
      background: rgba(255, 248, 233, 0.95);
      box-shadow: 0 22px 54px var(--shadow);
      position: relative;
      overflow: hidden;
      display: grid;
    }

    .answer-view,
    .roll-view,
    .board-view,
    .cell-view,
    .thinking-view {
      grid-area: 1 / 1;
      min-height: 0;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.985);
      filter: blur(8px);
      transition: opacity 680ms ease, transform 680ms cubic-bezier(.2,.8,.2,1), filter 680ms ease;
    }

    .stage.answer .answer-view,
    .stage.roll .roll-view,
    .stage.board .board-view,
    .stage.cell .cell-view,
    .stage.thinking .thinking-view {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
      filter: blur(0);
    }

    .stage.board {
      position: fixed;
      inset: 0;
      z-index: 20;
      border: 0;
      background: #b88938;
      box-shadow: none;
    }

    .answer-view {
      display: grid;
      grid-template-rows: 1fr auto;
      padding: clamp(18px, 3vw, 34px);
      gap: 18px;
      overflow: hidden;
    }

    .roll-view {
      display: grid;
      place-items: center;
      padding: clamp(24px, 4vw, 48px);
      background:
        radial-gradient(circle at 50% 48%, rgba(211, 155, 54, 0.25), transparent 20rem),
        linear-gradient(180deg, rgba(255, 248, 233, 0.96), rgba(242, 223, 189, 0.94));
    }

    .roll-ritual {
      display: grid;
      place-items: center;
      gap: 22px;
    }

    .roll-die {
      width: clamp(116px, 22vmin, 190px);
      height: clamp(116px, 22vmin, 190px);
      border: 4px solid var(--line);
      background: #fffdf5;
      display: grid;
      place-items: center;
      box-shadow:
        inset 0 -10px 0 rgba(32, 24, 19, 0.08),
        0 24px 60px rgba(32, 24, 19, 0.22);
      animation: dieFloat 2.4s ease-in-out infinite;
      transition: transform 80ms linear, box-shadow 120ms ease;
      transform: translate(var(--shake-x, 0), var(--shake-y, 0)) rotate(var(--spin, 0deg)) scale(var(--dice-scale, 1));
    }

    .roll-die svg {
      width: 76%;
      height: 76%;
    }

    .roll-die.rolling {
      animation: diceGlow 520ms ease-in-out infinite alternate;
    }

    .roll-caption {
      color: var(--muted);
      font-weight: 850;
      letter-spacing: 0;
    }

    @keyframes dieFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes diceGlow {
      from { box-shadow: inset 0 -10px 0 rgba(32, 24, 19, 0.08), 0 24px 60px rgba(32, 24, 19, 0.22); }
      to { box-shadow: inset 0 -10px 0 rgba(32, 24, 19, 0.08), 0 0 0 10px rgba(211, 155, 54, 0.12), 0 30px 70px rgba(32, 24, 19, 0.3); }
    }

    .messages {
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-right: 8px;
    }

    .message {
      max-width: min(760px, 100%);
      border: 2px solid rgba(64, 49, 38, 0.24);
      background: #fffaf0;
      padding: 14px;
      line-height: 1.48;
      font-size: 15px;
      white-space: pre-wrap;
    }

    .message.user {
      align-self: flex-end;
      background: #f3e3c5;
    }

    .message.master {
      align-self: flex-start;
    }

    .message.master.move-card {
      max-width: min(860px, 100%);
      width: min(860px, 100%);
      padding: 0;
      overflow: hidden;
      white-space: normal;
      border-color: rgba(32, 24, 19, 0.42);
      background:
        linear-gradient(180deg, rgba(255, 250, 240, 0.98), rgba(246, 231, 204, 0.98));
      box-shadow: 0 18px 42px rgba(32, 24, 19, 0.14);
    }

    .move-card-head {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 16px;
      background:
        radial-gradient(circle at 12% 30%, rgba(211, 155, 54, 0.28), transparent 12rem),
        rgba(64, 49, 38, 0.08);
      border-bottom: 2px solid rgba(64, 49, 38, 0.18);
    }

    .move-icon {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border: 2px solid var(--line);
      background: #fff8e9;
      box-shadow: inset 0 -5px 0 rgba(32, 24, 19, 0.07);
    }

    .move-icon svg {
      width: 38px;
      height: 38px;
    }

    .move-title {
      margin-top: 3px;
      font-size: clamp(19px, 2.6vw, 27px);
      font-weight: 950;
      line-height: 1.08;
    }

    .move-route {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 124px;
      font-weight: 950;
      color: var(--ink);
    }

    .route-node {
      border: 2px solid rgba(64, 49, 38, 0.22);
      background: rgba(255, 248, 233, 0.74);
      min-width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      font-size: 15px;
    }

    .route-arrow {
      color: var(--red);
      font-size: 20px;
      line-height: 1;
    }

    .route-arrow.up { color: var(--green); }
    .route-arrow.down { color: var(--gold); }

    .move-card-body {
      display: grid;
      gap: 12px;
      padding: 16px;
    }

    .move-section {
      border-left: 4px solid rgba(35, 109, 134, 0.36);
      padding: 4px 0 4px 12px;
    }

    .move-section h3 {
      margin: 0 0 6px;
      font-size: 13px;
      text-transform: uppercase;
      color: var(--muted);
      letter-spacing: 0;
    }

    .move-section p {
      margin: 0;
      color: #33281f;
      line-height: 1.52;
      white-space: pre-wrap;
    }

    .move-questions {
      display: grid;
      gap: 8px;
      margin-top: 4px;
    }

    .move-question {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 9px;
      align-items: start;
      padding: 10px;
      background: rgba(255, 248, 233, 0.8);
      border: 2px solid rgba(64, 49, 38, 0.16);
    }

    .question-mark {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      background: var(--ink);
      color: #fff8e9;
      font-weight: 900;
      font-size: 13px;
    }

    .cell-card {
      border-top: 2px solid rgba(64, 49, 38, 0.22);
      padding-top: 14px;
      display: grid;
      gap: 6px;
    }

    .cell-kicker {
      font-size: 12px;
      color: var(--blue);
      font-weight: 850;
      text-transform: uppercase;
    }

    .cell-title {
      font-size: 22px;
      font-weight: 900;
      line-height: 1.1;
    }

    .cell-lesson {
      margin: 0;
      color: #453528;
      line-height: 1.42;
    }

    .thinking-view {
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .lotus-loader {
      width: min(280px, 56vw);
      aspect-ratio: 1;
      position: relative;
      display: grid;
      place-items: center;
    }

    .lotus-loader::before,
    .lotus-loader::after {
      content: "";
      position: absolute;
      inset: 14%;
      border: 2px solid rgba(64, 49, 38, 0.22);
      border-radius: 50%;
      animation: lotusRing 2.6s ease-in-out infinite;
    }

    .lotus-loader::after {
      inset: 4%;
      animation-delay: 0.45s;
      opacity: 0.6;
    }

    .petal {
      --angle: 0deg;
      position: absolute;
      width: 34%;
      height: 54%;
      left: 33%;
      top: 7%;
      border: 2px solid var(--line);
      border-radius: 70% 70% 45% 45%;
      background: linear-gradient(180deg, rgba(255, 248, 233, 0.96), rgba(211, 155, 54, 0.34));
      transform-origin: 50% 80%;
      animation: lotusBreathe 2.7s ease-in-out infinite;
    }

    .petal:nth-child(1) { --angle: 0deg; }
    .petal:nth-child(2) { --angle: 45deg; animation-delay: 0.08s; }
    .petal:nth-child(3) { --angle: 90deg; animation-delay: 0.16s; }
    .petal:nth-child(4) { --angle: 135deg; animation-delay: 0.24s; }
    .petal:nth-child(5) { --angle: 180deg; animation-delay: 0.32s; }
    .petal:nth-child(6) { --angle: 225deg; animation-delay: 0.4s; }
    .petal:nth-child(7) { --angle: 270deg; animation-delay: 0.48s; }
    .petal:nth-child(8) { --angle: 315deg; animation-delay: 0.56s; }

    .lotus-core {
      width: 30%;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 3px solid var(--line);
      background: radial-gradient(circle, #fff7bd 0 18%, var(--gold) 19% 62%, #9f6820 63%);
      z-index: 2;
      animation: corePulse 1.8s ease-in-out infinite;
    }

    .thinking-text {
      position: absolute;
      bottom: -44px;
      width: max-content;
      color: var(--muted);
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0;
    }

    @keyframes lotusBreathe {
      0%, 100% { transform: rotate(var(--angle)) scale(0.86); opacity: 0.52; }
      50% { transform: rotate(var(--angle)) scale(1.12); opacity: 1; }
    }

    @keyframes lotusRing {
      0%, 100% { transform: scale(0.94); opacity: 0.18; }
      50% { transform: scale(1.04); opacity: 0.54; }
    }

    @keyframes corePulse {
      0%, 100% { transform: scale(0.94); }
      50% { transform: scale(1.08); }
    }

    .board-view {
      padding: clamp(10px, 1.6vw, 18px);
      display: grid;
      place-items: center;
      background: #b88938;
      position: relative;
      animation: boardReveal 820ms cubic-bezier(.2,.8,.2,1);
    }

    .board-wrap {
      width: min(100%, calc((100vh - 150px) * 8 / 9));
      max-width: 1180px;
      aspect-ratio: 8 / 9;
      position: relative;
      border: 3px solid var(--line);
      background: var(--paper);
      overflow: hidden;
      box-shadow: inset 0 0 0 2px rgba(255, 248, 233, 0.7);
    }

    .stage.board .board-view {
      padding: clamp(8px, 1.4vmin, 18px);
      background:
        radial-gradient(circle at 50% 45%, rgba(255, 248, 233, 0.26), transparent 38%),
        #b88938;
    }

    .stage.board .board-wrap {
      width: min(calc(100vw - 20px), calc((100vh - 20px) * 8 / 9));
      height: min(calc(100vh - 20px), calc((100vw - 20px) * 9 / 8));
      max-width: none;
      box-shadow:
        0 24px 70px rgba(32, 24, 19, 0.34),
        inset 0 0 0 2px rgba(255, 248, 233, 0.7);
    }

    .board-wrap.roll-mode {
      animation: boardPulse 900ms ease-in-out infinite alternate;
    }

    @keyframes boardReveal {
      from { opacity: 0; transform: scale(0.92); filter: blur(10px) saturate(0.8); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes boardPulse {
      from { filter: saturate(0.95) brightness(0.98); }
      to { filter: saturate(1.18) brightness(1.05); }
    }

    .board-wrap.transfer-mode .plane-bands {
      opacity: 0.12;
      filter: grayscale(0.6);
    }

    .plane-bands,
    .path-lines {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .plane-bands { z-index: 0; opacity: 0.32; }
    .path-lines { z-index: 3; }

    .board {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(9, 1fr);
    }

    .cell {
      position: relative;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid rgba(32, 24, 19, 0.34);
      background: rgba(255, 248, 233, 0.84);
      overflow: hidden;
      transition: opacity 180ms ease, filter 180ms ease, transform 180ms ease, box-shadow 160ms ease;
    }

    .cell:nth-child(2n) { background: rgba(243, 227, 197, 0.88); }
    .cell.goal { background: rgba(255, 224, 128, 0.9); }
    .cell.current { box-shadow: inset 0 0 0 4px rgba(184, 69, 54, 0.78); }
    .cell.step-focus {
      z-index: 2;
      animation: cellStepPulse 520ms ease-out;
      box-shadow:
        inset 0 0 0 4px rgba(255, 248, 233, 0.92),
        inset 0 0 0 8px rgba(184, 69, 54, 0.72),
        0 0 24px rgba(184, 69, 54, 0.42);
    }
    .cell.transfer-cell { box-shadow: inset 0 0 0 2px rgba(211, 155, 54, 0.48); }
    .cell.transfer-cell .cell-number { color: #8a5d11; }

    .board-wrap.transfer-mode .cell:not(.transfer-focus) {
      opacity: 0.18;
      filter: grayscale(0.86) brightness(0.62);
    }

    .cell.transfer-focus {
      opacity: 1;
      z-index: 2;
      transform: scale(1.035);
      box-shadow:
        inset 0 0 0 4px rgba(255, 248, 233, 0.96),
        inset 0 0 0 7px rgba(211, 155, 54, 0.88),
        0 0 20px rgba(211, 155, 54, 0.58);
    }

    .cell-number {
      position: absolute;
      top: 5px;
      left: 6px;
      font: 850 clamp(9px, 1.2vw, 14px) / 1 "Segoe UI", Arial, sans-serif;
      color: rgba(32, 24, 19, 0.74);
    }

    .cell-name {
      position: absolute;
      left: 5px;
      right: 5px;
      bottom: 4px;
      text-align: center;
      font: 750 clamp(6px, 0.8vw, 10px) / 1.06 "Segoe UI", Arial, sans-serif;
      color: rgba(32, 24, 19, 0.78);
      overflow-wrap: anywhere;
    }

    .cell svg {
      width: min(47%, 46px);
      height: min(47%, 46px);
      opacity: 0.93;
    }

    .jump {
      fill: none;
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      transition: opacity 180ms ease, stroke-width 180ms ease, filter 180ms ease;
    }

    .jump.up { stroke: var(--green); marker-end: url(#arrowHead); }
    .jump.down { stroke: var(--gold); marker-end: url(#arrowHeadGold); }

    .jump.active {
      stroke-width: 6;
      opacity: 0.96;
      filter: drop-shadow(0 0 8px rgba(255, 248, 233, 0.78)) drop-shadow(0 3px 3px rgba(32, 24, 19, 0.3));
      animation: activePath 760ms ease-in-out infinite alternate;
    }

    @keyframes activePath {
      from { stroke-dasharray: 10 10; stroke-dashoffset: 20; }
      to { stroke-dasharray: 18 8; stroke-dashoffset: 0; }
    }

    @keyframes cellStepPulse {
      0% { transform: scale(1); }
      42% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .token {
      position: absolute;
      z-index: 5;
      width: clamp(42px, 6vw, 68px);
      height: clamp(42px, 6vw, 68px);
      transform: translate(-50%, -50%);
      transition: left 560ms cubic-bezier(.18,.82,.2,1), top 560ms cubic-bezier(.18,.82,.2,1), transform 260ms ease;
      filter: drop-shadow(0 8px 8px rgba(32, 24, 19, 0.3));
      pointer-events: none;
    }

    .token.step { transform: translate(-50%, -68%) scale(1.18); }
    .token.boost { animation: tokenBoost 620ms ease-in-out infinite alternate; }
    .token.drop { animation: tokenDrop 520ms ease-in-out infinite alternate; }

    @keyframes tokenBoost {
      from { transform: translate(-50%, -58%) scale(1.04) rotate(-3deg); filter: drop-shadow(0 8px 8px rgba(32, 24, 19, 0.28)); }
      to { transform: translate(-50%, -72%) scale(1.16) rotate(3deg); filter: drop-shadow(0 0 15px rgba(211, 155, 54, 0.72)); }
    }

    @keyframes tokenDrop {
      from { transform: translate(-50%, -48%) scale(1.04) rotate(4deg); filter: drop-shadow(0 8px 8px rgba(32, 24, 19, 0.3)); }
      to { transform: translate(-50%, -35%) scale(0.94) rotate(-5deg); filter: drop-shadow(0 10px 4px rgba(184, 69, 54, 0.42)); }
    }

    .transfer-effects {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      overflow: hidden;
    }

    .transfer-particle {
      position: absolute;
      left: calc(var(--x) * 1%);
      top: calc(var(--y) * 1%);
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0.2);
      animation: particleBurst 760ms ease-out forwards;
      animation-delay: var(--delay);
    }

    .transfer-particle.up {
      background: radial-gradient(circle, #fff7b8 0 18%, rgba(211, 155, 54, 0.9) 19% 48%, rgba(77, 134, 72, 0) 70%);
      box-shadow: 0 0 14px rgba(211, 155, 54, 0.55);
    }

    .transfer-particle.down {
      background: radial-gradient(circle, #fff5c8 0 18%, rgba(211, 155, 54, 0.92) 19% 48%, rgba(211, 155, 54, 0) 70%);
      box-shadow: 0 0 14px rgba(211, 155, 54, 0.5);
    }

    @keyframes particleBurst {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.2); }
      30% { opacity: 1; }
      100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.35); }
    }

    .die-float {
      position: absolute;
      right: 18px;
      top: 18px;
      z-index: 7;
      width: 84px;
      height: 84px;
      border: 3px solid var(--line);
      background: #fffdf5;
      display: grid;
      place-items: center;
      box-shadow: inset 0 -7px 0 rgba(32, 24, 19, 0.08), 0 12px 24px rgba(32, 24, 19, 0.2);
      transition: right 240ms ease, top 240ms ease, transform 240ms ease, box-shadow 240ms ease;
    }

    .board-wrap.roll-mode .die-float {
      right: 50%;
      top: 50%;
      transform: translate(50%, -50%) scale(1.2);
      box-shadow: inset 0 -7px 0 rgba(32, 24, 19, 0.08), 0 24px 52px rgba(32, 24, 19, 0.36);
    }

    .die-float.rolling { animation: diceRoll 520ms cubic-bezier(.2,.8,.2,1); }
    .die-float svg { width: 68px; height: 68px; }

    @keyframes diceRoll {
      0% { rotate: 0deg; scale: 1; }
      35% { rotate: 18deg; scale: 1.16; }
      70% { rotate: -14deg; scale: 0.96; }
      100% { rotate: 0deg; scale: 1; }
    }

    .cell-view {
      display: grid;
      place-items: center;
      padding: clamp(24px, 4vw, 52px);
      background:
        radial-gradient(circle at 50% 35%, rgba(211, 155, 54, 0.28), transparent 18rem),
        linear-gradient(180deg, #fff8e9, #f2dfbd);
    }

    .cell-reveal {
      display: grid;
      place-items: center;
      gap: 18px;
      text-align: center;
      animation: cellReveal 900ms cubic-bezier(.2,.8,.2,1);
    }

    .cell-reveal-number {
      width: clamp(82px, 16vmin, 130px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 4px solid var(--line);
      background: #fffaf0;
      color: var(--red);
      font: 950 clamp(34px, 7vmin, 64px) / 1 "Segoe UI", Arial, sans-serif;
      box-shadow: inset 0 -9px 0 rgba(32, 24, 19, 0.08), 0 18px 44px rgba(32, 24, 19, 0.18);
    }

    .cell-reveal-title {
      max-width: min(760px, 100%);
      color: var(--ink);
      font: 950 clamp(30px, 6vw, 68px) / 1.02 "Segoe UI", Arial, sans-serif;
    }

    .cell-reveal-subtitle {
      color: var(--muted);
      font-weight: 850;
    }

    @keyframes cellReveal {
      from { opacity: 0; transform: translateY(18px) scale(0.96); filter: blur(10px); }
      to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    .composer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 140px;
      gap: 10px;
    }

    .send-stack {
      display: grid;
      grid-template-rows: minmax(64px, auto) 38px;
      gap: 8px;
      min-width: 0;
    }

    textarea {
      width: 100%;
      min-height: 64px;
      max-height: 150px;
      resize: vertical;
      border: 3px solid var(--line);
      background: rgba(255, 248, 233, 0.96);
      color: var(--ink);
      font: 15px / 1.42 "Segoe UI", Arial, sans-serif;
      padding: 12px;
      box-shadow: 0 14px 30px rgba(32, 24, 19, 0.12);
    }

    button {
      min-height: 64px;
      border: 0;
      background: var(--ink);

      const lines = String(text).split(/\n+/).map((line) => line.trim()).filter(Boolean);

      lines.forEach((line) => {
        if (/^Бросок[:：]/i.test(line)) {

        if (/^\d+[\.)]\s+/.test(line)) {

        const match = line.match(/^([^:]{3,34}):\s*(.*)$/);

          current = { title: match[1], lines: match[2] ? [match[2]] : [] };

          current.lines.push(line);

      if (current.lines.length) sections.push(current);
      return { sections, questions };

        `<svg viewBox="0 0 64 64"><path ${common} d="M32 7l7 17 18 2-14 12 4 18-15-10-15 10 4-18L7 26l18-2z"/><circle cx="32" cy="32" r="6" fill="${color}"/></svg>`,
        `<svg viewBox="0 0 64 64"><path ${common} d="M32 8c10 8 16 18 16 28a16 16 0 0 1-32 0c0-10 6-20 16-28z"/><path ${common} d="M24 39c5 4 11 4 16 0"/></svg>`,
        `<svg viewBox="0 0 64 64"><path ${common} d="M18 34c8-15 20-15 28 0M18 34c8 15 20 15 28 0"/><circle cx="32" cy="32" r="22" ${fill}/><circle cx="32" cy="32" r="5" fill="${color}"/></svg>`,
        `<svg viewBox="0 0 64 64"><path ${common} d="M32 8v48M18 20h28M14 44h36"/><path ${common} d="M20 20c0 11 5 19 12 24 7-5 12-13 12-24"/></svg>`,
        `<svg viewBox="0 0 64 64"><path ${common} d="M12 34c10-20 30-20 40 0M12 34c10 20 30 20 40 0M32 14v36"/><circle cx="32" cy="34" r="6" fill="${color}"/></svg>`,
        `<svg viewBox="0 0 64 64"><rect x="14" y="14" width="36" height="36" rx="2" ${fill}/><path ${common} d="M14 14h36v36H14zM22 22h20v20H22zM32 14v36M14 32h36"/></svg>`,
        `<svg viewBox="0 0 64 64"><path ${common} d="M32 8c7 12 15 18 24 20-9 2-17 8-24 20-7-12-15-18-24-20 9-2 17-8 24-20z"/><circle cx="32" cy="28" r="5" fill="${color}"/></svg>`,
        `<svg viewBox="0 0 64 64"><path ${common} d="M12 46c9-22 31-33 40-28-3 24-21 36-40 28zM24 41c6-8 13-14 23-19"/></svg>`,
        `<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="22" ${fill}/><path ${common} d="M32 10c9 8 14 15 14 22S40 46 32 54C24 46 18 39 18 32s5-14 14-22zM20 32h24"/></svg>`
      ];
      return symbols[type % symbols.length];
    }

    function diceSvg(value) {
      const dot = (x, y) => `<circle cx="${x}" cy="${y}" r="5" fill="#201813"></circle>`;
      const dots = {
        1: [[32,32]],
        2: [[22,22],[42,42]],
        3: [[22,22],[32,32],[42,42]],
        4: [[22,22],[42,22],[22,42],[42,42]],
        5: [[22,22],[42,22],[32,32],[22,42],[42,42]],
        6: [[22,20],[42,20],[22,32],[42,32],[22,44],[42,44]]
      }[value] || [];
      return `<svg viewBox="0 0 64 64"><rect x="8" y="8" width="48" height="48" rx="8" fill="#fffaf0" stroke="#201813" stroke-width="4"></rect>${dots.map(([x,y]) => dot(x,y)).join("")}</svg>`;
    }

    function tokenSvg() {
      return `<circle cx="32" cy="32" r="27" fill="#fff6dd" stroke="#201813" stroke-width="4"></circle><circle cx="32" cy="20" r="8" fill="#d39b36" stroke="#201813" stroke-width="3"></circle><path d="M18 49c2-12 8-18 14-18s12 6 14 18" fill="#236d86" stroke="#201813" stroke-width="3" stroke-linecap="round"></path><path d="M22 31c-5 4-7 9-7 15M42 31c5 4 7 9 7 15" fill="none" stroke="#201813" stroke-width="3" stroke-linecap="round"></path>`;
    }

    function buildBoard() {
      board.innerHTML = "";
      for (let displayRow = 0; displayRow < rows; displayRow++) {
        const visualRowFromBottom = rows - 1 - displayRow;
        const rowStart = visualRowFromBottom * cols + 1;
        const rowCells = Array.from({ length: cols }, (_, i) => rowStart + i);
        if (visualRowFromBottom % 2 === 1) rowCells.reverse();
        for (const n of rowCells) {
          const cell = document.createElement("div");
          cell.className = "cell";
          if (n === totalCells) cell.classList.add("goal");
          if (jumps[n]) cell.classList.add("transfer-cell");
          cell.dataset.cell = String(n);
          const color = colors[n % colors.length];
          cell.innerHTML = `
            <span class="cell-number">${n}${jumps[n] ? "*" : ""}</span>
            ${symbolSvg(n, color)}
            <span class="cell-name">${cellNames[n - 1]}</span>
          `;
          board.appendChild(cell);
        }
      }
    }

    function drawJumps() {
      pathLines.querySelectorAll(".jump").forEach((node) => node.remove());
      Object.entries(jumps).forEach(([from, to]) => {
        const curve = document.createElementNS("http://www.w3.org/2000/svg", "path");
        curve.setAttribute("class", `jump ${to > from ? "up" : "down"}`);
        curve.setAttribute("d", jumpPathData(Number(from), Number(to)));
        curve.dataset.from = String(from);
        curve.dataset.to = String(to);
        pathLines.appendChild(curve);
      });
    }

    function placeToken() {
      if (!state.position) return;
      const p = cellPoint(state.position);
      token.style.left = `${(p.x / 800) * 100}%`;
      token.style.top = `${(p.y / 900) * 100}%`;
      document.querySelectorAll(".cell.current").forEach((c) => c.classList.remove("current"));
      const cell = document.querySelector(`[data-cell="${state.position}"]`);
      if (cell) cell.classList.add("current");
      updateCellCard(state.position);
      updateStateLine();
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function rollDiceValue() {
      return Math.floor(Math.random() * 6) + 1;
    }

    function randomBetween(min, max) {
      return min + Math.random() * (max - min);
    }

    function shakeDie(node, intensity = 1) {
      node.style.setProperty("--shake-x", `${randomBetween(-18, 18) * intensity}px`);
      node.style.setProperty("--shake-y", `${randomBetween(-14, 14) * intensity}px`);
      node.style.setProperty("--spin", `${randomBetween(-42, 42) * intensity}deg`);
      node.style.setProperty("--dice-scale", String(randomBetween(0.9, 1.14)));
    }

    function settleDie(node) {
      node.style.setProperty("--shake-x", "0px");
      node.style.setProperty("--shake-y", "0px");
      node.style.setProperty("--spin", "0deg");
      node.style.setProperty("--dice-scale", "1");
    }

    async function rollDiceAnimation(finalValue, node = rollDie) {
      node.classList.remove("rolling");
      void node.offsetWidth;
      node.classList.add("rolling");
      for (let i = 0; i < 22; i++) {
        const value = i === 21 ? finalValue : rollDiceValue();
        shakeDie(node, 1 - i / 34);
        node.innerHTML = diceSvg(value);
        await sleep(38 + Math.random() * 52 + i * 5);
      }
      node.innerHTML = diceSvg(finalValue);
      settleDie(node);
      node.classList.remove("rolling");
      state.lastRoll = finalValue;
      updateStateLine();
    }

    function pulseCell(n) {
      const cell = document.querySelector(`.cell[data-cell="${n}"]`);
      if (!cell) return;
      cell.classList.remove("step-focus");
      void cell.offsetWidth;
      cell.classList.add("step-focus");
      window.setTimeout(() => cell.classList.remove("step-focus"), 560);
    }

    async function animateTo(target) {
      const direction = target >= state.position ? 1 : -1;
      while (state.position !== target) {
        const next = state.position + direction;
        state.position = next;
        token.classList.add("step");
        placeToken();
        pulseCell(next);
        await sleep(540);
        token.classList.remove("step");
        await sleep(170);
      }
    }

    function setActiveJump(from, to, active) {
      const path = pathLines.querySelector(`.jump[data-from="${from}"][data-to="${to}"]`);
      if (path) path.classList.toggle("active", active);
    }

    function setTransferFocus(from, to, active) {
      boardWrap.classList.toggle("transfer-mode", active);
      document.querySelectorAll(".cell.transfer-focus").forEach((cell) => cell.classList.remove("transfer-focus"));
      if (!active) return;
      [from, to].forEach((n) => {
        const cell = document.querySelector(`.cell[data-cell="${n}"]`);
        if (cell) cell.classList.add("transfer-focus");
      });
    }

    function createTransferParticles(curve, type) {
      const count = type === "up" ? 14 : 11;
      for (let i = 0; i < count; i++) {
        const t = count === 1 ? 0.5 : i / (count - 1);
        const point = pointOnCurve(curve, t);
        const particle = document.createElement("span");
        particle.className = `transfer-particle ${type}`;
        particle.style.setProperty("--x", String((point.x / 800) * 100));
        particle.style.setProperty("--y", String((point.y / 900) * 100));
        particle.style.setProperty("--size", `${type === "up" ? 13 + (i % 3) * 3 : 11 + (i % 2) * 4}px`);
        particle.style.setProperty("--delay", `${i * 34}ms`);
        particle.style.setProperty("--dx", `${type === "up" ? -10 + (i % 5) * 5 : -8 + (i % 4) * 5}px`);
        particle.style.setProperty("--dy", `${type === "up" ? -18 - (i % 4) * 5 : 18 + (i % 3) * 6}px`);
        transferEffects.appendChild(particle);
        window.setTimeout(() => particle.remove(), 1150 + i * 34);
      }
    }

    function animateJump(from, to) {
      const curve = jumpCurve(from, to);
      const type = to > from ? "up" : "down";
      const duration = 1800;
      setTransferFocus(from, to, true);
      setActiveJump(from, to, true);
      createTransferParticles(curve, type);
      token.classList.add(type === "up" ? "boost" : "drop");
      return new Promise((resolve) => {
        const startTime = performance.now();
        function frame(now) {
          const elapsed = Math.min(1, (now - startTime) / duration);
          const eased = 1 - Math.pow(1 - elapsed, 3);
          const point = pointOnCurve(curve, eased);
          token.style.left = `${(point.x / 800) * 100}%`;
          token.style.top = `${(point.y / 900) * 100}%`;
          if (elapsed < 1) {
            requestAnimationFrame(frame);
            return;
          }
          state.position = to;
          token.classList.remove("boost", "drop");
          setActiveJump(from, to, false);
          setTransferFocus(from, to, false);
          placeToken();
          resolve();
        }
        requestAnimationFrame(frame);
      });
    }

    async function dramaticTransfer(from, to) {
      setTransferFocus(from, to, true);
      setActiveJump(from, to, true);
      await sleep(1200);
      await animateJump(from, to);
    }

    async function revealCellScreen() {
      cellRevealNumber.textContent = String(state.position);
      cellRevealTitle.textContent = cellNames[state.position - 1];
      setStage("cell");
      await sleep(3000);
    }

    async function showBoardForMove(roll) {
      setStage("roll");
      await sleep(360);
      await rollDiceAnimation(roll, rollDie);
      await sleep(520);

      let transition = null;
      const moveFrom = state.position;
      if (!state.entered) {
        if (roll !== 6) {
          return { transition, from: moveFrom, to: state.position, revealed: false };
        }

        setStage("board");
        die.innerHTML = diceSvg(roll);
        await sleep(860);

        if (roll === 6) {
          state.entered = true;
          state.position = 1;
          placeToken();
          pulseCell(1);
          await sleep(2000);
          await revealCellScreen();
          return { transition, from: moveFrom, to: state.position, revealed: true };
        }
      }

      setStage("board");
      die.innerHTML = diceSvg(roll);
      await sleep(860);

      let target = state.position + roll;
      if (target > totalCells) target = totalCells - (target - totalCells);
      await animateTo(target);

      if (jumps[state.position]) {
        const from = state.position;
        const to = jumps[from];
        transition = { from, to, type: to > from ? "Стрела" : "Змея" };
        await dramaticTransfer(from, to);
      }

      await sleep(2000);
      await revealCellScreen();
      return { transition, from: moveFrom, to: state.position, revealed: true };
    }

    function buildLocalPromptContext(move) {
      const n = state.position || 0;
      const cellName = n ? cellNames[n - 1] : "Вход еще не открыт";
      const lesson = n ? lessons[n - 1] : "Игрок еще стоит перед порогом.";
      const entered = state.entered ? "игра началась" : "игра не началась";
      const transition = move.transition ? `${move.transition.type}: ${move.transition.from} (${cellNames[move.transition.from - 1]}) -> ${move.transition.to} (${cellNames[move.transition.to - 1]})` : "перехода нет";
      return { n, cellName, lesson, entered, transition };
    }

    async function askGpt(userText, move) {
      if (GPT_ENDPOINT) {
        const headers = { "Content-Type": "application/json" };
        const apiKey = apiKeyInput.value.trim();
        if (apiKey) {
          headers["X-OpenRouter-API-Key"] = apiKey;
        }

        const response = await fetch(GPT_ENDPOINT, {
          method: "POST",
          headers,
          body: JSON.stringify({
            system: SYSTEM_PROMPT,
            state,
            move,
            messages: state.history.slice(-12),
            user: userText
          })
        });
        if (!response.ok) throw new Error("GPT endpoint error");
        const data = await response.json();
        return data.reply || data.text || data.message || localMasterReply(userText, move);
      }
      return localMasterReply(userText, move);
    }

    function localMasterReply(userText, move) {
      const ctx = buildLocalPromptContext(move);
      if (state.phase === "awaiting_intention") {
        return "Ты вошла в пространство Лилы, но еще стоишь у порога. Напиши свой запрос любыми словами — даже неровно, даже коротко. Первый ответ станет Намерением, и после него будет сделан бросок на вход.";
      }
      if (!state.entered) {
        return `Бросок: ${move.roll}. Вход не открыт. Шестерка не выпала, и это не случайная задержка: часть тебя хочет результата, но еще торгуется с ценой честности.\n\nТвое Намерение: ${state.intention}\n\nПорог Лилы не пропускает того, кто хочет наблюдать процесс со стороны. Здесь либо входишь, либо продолжаешь изображать готовность.\n\n1. Где именно ты сейчас оставляешь себе лазейку?\n2. Что ты называешь осторожностью, хотя это просто отказ войти?`;
      }
      if (move.enteredNow) {
        return `Бросок: 6. Вход открыт. Клетка 1 — Рождение.\n\nТы не “начинаешь практику”. Ты родилась внутри собственного запроса, а значит больше нельзя делать вид, что он внешний. Намерение теперь будет проверять не твои слова, а твою способность выдерживать отражение.\n\nТень клетки: желание начать красиво, без грязи, без страха, без признания зависимости. Но рождение всегда мокрое, резкое и необратимое.\n\n1. Что в твоем запросе ты хотела бы оставить стерильным?\n2. Какую правду ты уже знаешь, но еще не произнесла?`;
      }

      let transitionText = "";
      if (move.transition) {
        const from = cellNames[move.transition.from - 1];
        const to = cellNames[move.transition.to - 1];
        const vector = move.transition.to > move.transition.from ? "восходящий поток" : "нисходящий поток";
        transitionText = `\n\n${move.transition.type}: ${move.transition.from} (${from}) -> ${move.transition.to} (${to}). Это ${vector}. Причина не в “награде” и не в “наказании”, а в связи: ${from} вскрывает механизм, который неизбежно переносит тебя в ${to}. Относительно твоего Намерения это место, где следствие уже было заложено в мотиве.`;
      }

      return `Бросок: ${move.roll}. Клетка ${ctx.n} — ${ctx.cellName}.\n\n${ctx.lesson}\n\nРазбор: смотри не на название клетки, а на то, что оно делает с твоим Намерением: ${state.intention}. Эта клетка показывает не идею, а привычный способ защиты. Там, где ты говоришь “я разбираюсь”, может быть контроль. Там, где говоришь “я принимаю”, может быть усталость бороться. Там, где говоришь “мне все равно”, часто лежит не свобода, а отказ чувствовать цену выбора.${transitionText}\n\n1. Какую выгоду тебе дает оставаться в этой клетке?\n2. Какую часть ответа ты сейчас пытаешься сделать умной, чтобы не сделать ее честной?`;
    }

    function makeMoveResult(roll, boardMove, enteredBefore) {
      return {
        roll,
        enteredBefore,
        enteredNow: !enteredBefore && state.entered,
        from: boardMove.from,
        to: boardMove.to,
        revealed: boardMove.revealed,
        position: state.position,
        cell: state.position ? cellNames[state.position - 1] : null,
        transition: boardMove.transition
      };
    }

    async function processUserText(text) {
      addMessage("user", text);
      userInput.value = "";
      state.busy = true;
      sendButton.disabled = true;
      userInput.disabled = true;

      if (state.phase === "awaiting_intention") {
        setStage("thinking");
        await sleep(1400);
        state.intention = text;
        state.phase = "playing";
      } else {
        setStage("thinking");
        await sleep(900);
      }

      const enteredBefore = state.entered;
      const roll = rollDiceValue();
      const boardMove = await showBoardForMove(roll);
      const move = makeMoveResult(roll, boardMove, enteredBefore);

      if (move.revealed) {
        setStage("answer");
        await sleep(260);
      } else {
        setStage("thinking");
        await sleep(2300);
      }

      let reply;
      try {
        reply = await askGpt(text, move);
      } catch {
        reply = localMasterReply(text, move);
      }

      addMessage("master", reply, move);
      updateCellCard(state.position);
      updateStateLine();
      setStage("answer");

      state.busy = false;
      sendButton.disabled = false;
      userInput.disabled = false;
      userInput.focus();
    }

    composer.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = userInput.value.trim();
      if (!text || state.busy) return;
      processUserText(text);
    });

    userInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
        composer.requestSubmit();
      }
    });

    buildBoard();
    drawJumps();
    token.innerHTML = tokenSvg();
    die.innerHTML = diceSvg(1);
    rollDie.innerHTML = diceSvg(1);
    apiKeyInput.value = sessionStorage.getItem("openrouter_api_key") || "";
    apiKeyInput.addEventListener("input", () => {
      const value = apiKeyInput.value.trim();
      if (value) {
        sessionStorage.setItem("openrouter_api_key", value);
      } else {
        sessionStorage.removeItem("openrouter_api_key");
      }
    });
    placeToken();
    updateCellCard(0);
    updateStateLine();
    addMessage("master", "Я приветствую тебя в пространстве Лилы.\n\nНапиши свой запрос к игре любыми словами. Первый ответ станет твоим Намерением, после него будет сделан бросок на вход. Войти можно только через 6.");
  </script>
</body>
